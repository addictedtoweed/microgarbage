# vm.cfg — example configuration for the microgarbage shell host.
#
# WHERE THIS IS LOADED FROM
#   At startup the host reads "./vm.cfg" from the CURRENT WORKING
#   DIRECTORY (silently ignored if absent). Override with:
#       host.exe --config=<path>     load a specific config file
#       host.exe --no-config         ignore ./vm.cfg entirely
#   NOTE: this config file is CWD-relative, whereas the default /host
#   mount is resolved next to the executable. The simplest way to get
#   both this file AND the relative paths below to line up is to launch
#   from this directory:
#       cd examples/05_shell
#       ./build/host.exe
#
# Every setting is OPTIONAL — anything omitted keeps the built-in
# default shown in [brackets]. Paths are relative to the launch
# directory (CWD) unless absolute. INI format: [section] headers,
# key = value, with '#' or ';' line comments.

[memory]
# Local slab: per-VM storage (VmCpu, mailbox, data regions), in KB.
#   range 32 .. 1536          [default 1536]
local_kb       = 1536
# Shared slab: the SYS_ALLOC pool shared across VMs, in KB.
#   range 8 .. 64             [default 64]
shared_kb      = 64
# Maximum concurrently-loaded VMs.
#   range 1 .. 16             [default 4]
max_vms        = 4
# RAM each spawned VM (run /host/x.elf) gets for its data region, KB.
#   range 1 .. 256            [default 64]
spawn_data_kb  = 64

[stdio]
# Put the terminal into raw mode (no echo / line buffering) on a tty.
#   bool                      [default true]
raw_mode       = true

# ------------------------------------------------------------------
# MOUNTS — the guest filesystem namespace (/td0, /host, ...).
#
# IMPORTANT: declaring ANY [mount.*] section REPLACES the host's
# built-in default mounts entirely — there is then no automatic /td0
# or /host. So list every mount you want. The two below reproduce the
# useful defaults: an in-RAM scratch volume and the host passthrough.
#
# Mount types:
#   host   passthrough to a real host directory   (path=, writable=)
#   tmpfs  in-RAM FatFs volume, formatted each run (size_kb=)
#   sd     treated like tmpfs here (placeholder for real SD storage)
# The built-in "trash0" trashfs mount has no config type; it exists
# only under the built-in defaults (i.e. when you declare no mounts).
# ------------------------------------------------------------------

# /td0 — writable in-RAM scratch volume (ls, mkdir, write, cat, run).
[mount.td0]
type     = tmpfs
size_kb  = 128                 # accepted (range 8..4096) but currently
                               # IGNORED — the built-in tmpfs uses a fixed
                               # 128 KB in-RAM pool. Kept for forward-compat.

# /host — the spawnable demo apps (hello, snake, car, musicplayer, ...)
# plus any files you drop in. This points at examples/05_shell/host_files
# (where the build puts the .elf spawnables), so `run /host/snake.elf`
# works without --host-fs when launched from examples/05_shell.
[mount.host]
type     = host
path     = host_files          # CWD-relative; an absolute path is fine too
writable = false               # set true to let guests write into /host
