# ld65 config for snes/fblank_test.s — standalone HiROM mid-frame
# forced-blank VRAM DMA test. Single-file ROM, same shape as
# dma_test.cfg: CODE at $8000, HEADER at $FFC0, VECTORS at $FFE4.
#
# Public domain (CC0). No warranty.

MEMORY {
    ROM:     start = $0000, size = $10000, type = ro, fill = yes, fillval = $00, file = %O;
}

SEGMENTS {
    CODE:    load = ROM, type = ro, start = $8000;
    HEADER:  load = ROM, type = ro, start = $FFC0;
    VECTORS: load = ROM, type = ro, start = $FFE4;
}
