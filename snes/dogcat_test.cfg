# ld65 config — dogcat_test: 128 KB HiROM. Image data is linear at $C0:0000+ so
# DMA sources address cleanly via .bankbyte/.loword (no LoROM 32 KB-window juggling).
#   bank $C0: pal + tilemaps + dog CHR (below $8000), CODE/HEADER/VECTORS ($8000+)
#   bank $C1: dog_bg3 + cat CHR
MEMORY {
    ROM: start = $C00000, size = $20000, type = ro, fill = yes, fillval = $00, file = %O;
}

SEGMENTS {
    RODATA0: load = ROM, type = ro, start = $C00000;   # pal, tmap_a/b, dog_bg1
    CODE:    load = ROM, type = ro, start = $C08000;
    HEADER:  load = ROM, type = ro, start = $C0FFC0;
    VECTORS: load = ROM, type = ro, start = $C0FFE4;
    RODATA1: load = ROM, type = ro, start = $C10000;   # dog_bg3, cat_bg1, cat_bg3
}
