# ld65 config — the HiROM boot image the copro serves at reset.
#
# The copro presents its 64 KB M7 DTCM as the cart ROM, decoding only A0-A15
# (mirrored across every bank, ROM-select gated). HiROM maps the full 64 KB to
# $0000-$FFFF of a bank (e.g. $C0), so the whole window is flat-addressable;
# bank $00 $8000-$FFFF aliases the upper half, where boot + vectors live.
#
# The RAM kernel is STORED in the upper half (load=ROM) but assembled to RUN
# from low WRAM ($0400); boot.s copies it across using the linker-exported
# __KERNEL_LOAD__ / __KERNEL_RUN__ / __KERNEL_SIZE__.
#
# Public domain (CC0). No warranty.

MEMORY {
    # low WRAM the kernel runs from (after DP $00xx, stack $01xx, vars $02xx)
    KRAM:    start = $0400,  size = $1C00,  type = rw, define = yes;

    # the 64 KB window; HiROM file offset == address ($0000-$FFFF)
    ROM:     start = $0000,  size = $10000, type = ro, fill = yes, fillval = $00, file = %O;
}

SEGMENTS {
    BOOT:    load = ROM, type = ro,  start = $8000;          # boot stub (upper half, bank $00 exec)
    KERNEL:  load = ROM, run = KRAM, type = rw, define = yes, align = $100;  # stored upper half, runs in WRAM
    TRAMP:   load = ROM, type = ro,  start = $FFB0;          # NMI/IRQ trampolines (copro keeps static)
    HEADER:  load = ROM, type = ro,  start = $FFC0;          # SNES header (HiROM, $FFC0)
    VECTORS: load = ROM, type = ro,  start = $FFE4;          # 65816 vectors
}
