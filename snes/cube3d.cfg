# ld65 config for snes/cube3d.s — standalone 32KB LoROM.
# Code/data occupy file $0000-$7FFF, addressed $8000-$FFFF and mapped to
# $00:8000-FFFF (LoROM). Header at $FFC0 (file $7FC0), vectors at $FFE4.
# This is the canonical LoROM layout — boots cleanly in bsnes-accuracy, ares,
# and on real hardware (unlike the HiROM-shaped test-ROM cfgs).

MEMORY {
    ROM:     start = $8000, size = $8000, type = ro, fill = yes, fillval = $00, file = %O;
}

SEGMENTS {
    CODE:    load = ROM, type = ro, start = $8000;
    HEADER:  load = ROM, type = ro, start = $FFC0;
    VECTORS: load = ROM, type = ro, start = $FFE4;
}
