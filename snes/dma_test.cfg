# ld65 config for snes/dma_test.s — standalone HiROM CHR DMA test.
#
# Single-file ROM with no kernel-copy step. Code + data live in CODE
# segment starting at $8000; HEADER at $FFC0; VECTORS at $FFE4.
# HiROM mirror means bank $00 $8000-$FFFF aliases to bank $80 $0000-$7FFF.
#
# Public domain (CC0). No warranty.

MEMORY {
    ROM:     start = $0000, size = $10000, type = ro, fill = yes, fillval = $00, file = %O;
}

SEGMENTS {
    CODE:    load = ROM, type = ro, start = $8000;
    HEADER:  load = ROM, type = ro, start = $FFC0;
    VECTORS: load = ROM, type = ro, start = $FFE4;
}
